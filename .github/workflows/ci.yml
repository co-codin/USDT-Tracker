name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: listener
          POSTGRES_PASSWORD: listener
          POSTGRES_DB: tron_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U listener -d tron_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://listener:listener@localhost:5432/tron_test?sslmode=disable
      - name: build
        run: go build ./cmd/listener

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm dependency build
        run: helm dependency build deploy/helm/usdt-tracker
      - name: helm lint
        run: helm lint deploy/helm/usdt-tracker --set secrets.apiToken=0123456789abcdef0123
      - name: helm template (bundled and external Postgres)
        run: |
          helm template ci deploy/helm/usdt-tracker > /dev/null
          helm template ci deploy/helm/usdt-tracker --set postgresql.enabled=false \
            --set externalDatabase.url=postgres://u:p@db:5432/tron --set ingress.enabled=true > /dev/null
