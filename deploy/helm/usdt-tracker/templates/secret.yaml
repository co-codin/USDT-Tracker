{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "usdt-tracker.fullname" . }}
  labels:
    {{- include "usdt-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.apiToken }}
  API_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.tronApiKey }}
  TRON_PRO_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.telegramBotToken }}
  TELEGRAM_BOT_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.webhookSecret }}
  WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret) }}
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
{{- end }}
