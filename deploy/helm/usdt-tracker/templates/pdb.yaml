{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "usdt-tracker.fullname" . }}
  labels:
    {{- include "usdt-tracker.labels" . | nindent 4 }}
spec:
  # Single writer (replicas: 1): maxUnavailable 0 blocks node drains, so the
  # default 1 only rate-limits voluntary evictions; set 0 to pin the pod.
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "usdt-tracker.selectorLabels" . | nindent 6 }}
{{- end }}
