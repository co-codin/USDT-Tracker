{{- /* Render-time guard rails (no resources). */ -}}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1: the listener is a single writer (one cursor); scale vertically" }}
{{- end }}
{{- if and .Values.postgresql.enabled (or .Values.externalDatabase.url .Values.externalDatabase.existingSecret) }}
{{- fail "set either postgresql.enabled=true (bundled) or externalDatabase.*, not both" }}
{{- end }}
{{- with .Values.secrets.apiToken }}
{{- if lt (len .) 16 }}
{{- fail "secrets.apiToken must be at least 16 characters (e.g. openssl rand -hex 32)" }}
{{- end }}
{{- end }}
{{- range (.Values.config.chains | default (list "tron")) }}
{{- if not (has . (list "tron" "ton" "eth")) }}
{{- fail (printf "config.chains: unknown chain %q (want tron|ton|eth)" .) }}
{{- end }}
{{- end }}
{{- $db := include "usdt-tracker.databaseEnabled" . }}
{{- if and .Values.secrets.existingSecretHasDatabaseUrl (not .Values.secrets.existingSecret) }}
{{- fail "secrets.existingSecretHasDatabaseUrl=true requires secrets.existingSecret" }}
{{- end }}
{{- if and .Values.secrets.existingSecretHasDatabaseUrl .Values.postgresql.enabled }}
{{- fail "secrets.existingSecretHasDatabaseUrl=true: set postgresql.enabled=false (the bundled database would override DATABASE_URL)" }}
{{- end }}
{{- if and (dig "notify_bot" "enabled" false (.Values.config | default dict)) (not $db) }}
{{- fail "config.notify_bot.enabled=true requires a database: enable postgresql, set externalDatabase.url / externalDatabase.existingSecret, or secrets.existingSecretHasDatabaseUrl=true" }}
{{- end }}
