# Default values for usdt-tracker.
# NEVER put real secrets in this file; pass them with --set / a private values
# file, or reference an existing Kubernetes Secret (secrets.existingSecret).

image:
  # Published by the release workflow (linux/amd64, linux/arm64).
  repository: ghcr.io/co-codin/usdt-tracker
  tag: v0.3.0            # defaults to the chart appVersion release; pin a digest in production
  digest: ""             # e.g. sha256:...; wins over tag when set
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The listener is a single-writer process (one cursor). Keep exactly one
# replica; the Deployment uses the Recreate strategy so two pods never run
# side by side during upgrades.
replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# --- Application configuration ---------------------------------------------
# Rendered into config.yaml (mounted at /etc/usdt-tracker/config.yaml).
# Same schema as config.example.yaml; unknown keys are rejected by the app.
# Secrets and database settings are injected as env vars and override this.
config:
  log:
    level: info
    format: json
  # tron (default), ton, eth, e.g. [tron, ton, eth]. Each chain has its own cursor.
  chains: [tron]
  ton:
    api_url: https://toncenter.com/api/v3
    rps: 1                 # ~9 with secrets.toncenterApiKey (free key from @tonapibot)
    jetton_master: EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs   # official USD₮
    confirmations: 3
    start_block: 0
    watch_addresses: []    # static TON addresses (EQ…/UQ…/0:<hex>); runtime ones via the API
  eth:
    # rpc_url defaults to the free public node; put a provider URL with a key
    # in secrets.ethRpcUrl (ETH_RPC_URL) instead of here.
    rps: 5
    contract: "0xdAC17F958D2ee523a2206206994597C13D831ec7"   # USDT (ERC-20)
    confirmations: 12
    start_block: 0
    log_chunk: 50
    watch_addresses: []    # static Ethereum addresses (0x…); runtime ones via the API
  tron:
    api_url: https://api.trongrid.io
    rps: 3
  listener:
    confirmations: 20
    start_block: 0
  filter:
    watch_addresses: []    # static addresses; runtime ones go through the API
    direction: both
    min_amount: "0"
    mode: any
    reload_interval: 5s
  sinks:
    stdout:
      enabled: true        # JSON lines in the pod log
    webhook:
      enabled: false
      url: ""              # secret part (signing key) is secrets.webhookSecret
    telegram:
      enabled: false
      chat_id: ""          # bot token is secrets.telegramBotToken
  notify_bot:              # self-service bot; token: secrets.notifyBotToken; needs Postgres
    enabled: false
    free_limit: 3
    premium_limit: 50
    max_users: 10000
    max_total_subs: 50000
    commands_per_minute: 20
    min_amount: "0.01"
  alerts:
    large_transfers:       # every transfer >= threshold on any chain → Telegram channel
      enabled: false
      chat_id: ""          # e.g. @usdt_whales; token: secrets.largeAlertsBotToken or secrets.telegramBotToken
      threshold: "100000"
      interval: 3s
      footer: ""

# Extra plain env vars (non-secret), e.g. {LISTENER_START_BLOCK: "-100"}.
extraEnv: {}

# --- Secrets ------------------------------------------------------------------
secrets:
  # Use an existing Secret instead of creating one. Recognised keys (all
  # optional): API_TOKEN, TRON_PRO_API_KEY, TONCENTER_API_KEY, ETH_RPC_URL, TELEGRAM_BOT_TOKEN, LARGE_ALERTS_BOT_TOKEN, TELEGRAM_NOTIFY_BOT_TOKEN,
  # WEBHOOK_SECRET, DATABASE_URL.
  existingSecret: ""
  # Set to true when existingSecret contains DATABASE_URL (and set
  # postgresql.enabled=false). Without it the chart cannot know a database is
  # configured and would disable the Postgres sink. Prefer
  # externalDatabase.existingSecret, which needs no flag.
  existingSecretHasDatabaseUrl: false
  # Values below are only used when existingSecret is empty. Leave empty here.
  apiToken: ""             # admin API bearer token (>= 16 chars); also guards /v1/export.csv; empty = API disabled
  tronApiKey: ""           # TronGrid TRON-PRO-API-KEY
  toncenterApiKey: ""      # toncenter API key (X-API-Key); strongly recommended when config.chains has ton
  ethRpcUrl: ""            # Ethereum JSON-RPC URL (often embeds a provider key); empty = public node
  telegramBotToken: ""
  notifyBotToken: ""       # TELEGRAM_NOTIFY_BOT_TOKEN for the self-service notify bot
  largeAlertsBotToken: ""  # optional separate bot for the large-transfer channel
  webhookSecret: ""        # HMAC-SHA256 signing key for the webhook sink

# --- Database -----------------------------------------------------------------
# Option A (default, demo): bundled Bitnami PostgreSQL subchart.
postgresql:
  enabled: true
  auth:
    username: listener
    database: tron
    password: ""           # empty = generated and kept in <release>-postgresql
    existingSecret: ""     # or reference your own secret (key: password)
    secretKeys:
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}

# Option B (production): external/managed Postgres. Set postgresql.enabled=false
# and either url (stored in the chart's Secret) or existingSecret+key.
externalDatabase:
  url: ""                  # postgres://user:pass@host:5432/db?sslmode=require
  existingSecret: ""
  existingSecretKey: DATABASE_URL
  # Optional: keep the password out of the URL. When name is set the pod gets
  # DATABASE_PASSWORD from this secret key and the app merges it into the URL
  # (url/existingSecret then hold e.g. postgres://user@host:5432/db). Any
  # characters are allowed; no URL-escaping needed. Works with an existing
  # managed-DB secret (e.g. CloudNativePG "<cluster>-app", key "password").
  passwordSecret:
    name: ""
    key: password

# --- Networking ---------------------------------------------------------------
containerPort: 9090        # /metrics, /healthz, /v1/addresses

service:
  type: ClusterIP
  port: 9090
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: usdt-tracker.example.com
      paths:
        # Only the admin API by default; /metrics and /healthz stay internal.
        - path: /v1
          pathType: Prefix
  tls: []
  #  - secretName: usdt-tracker-tls
  #    hosts: [usdt-tracker.example.com]

serviceMonitor:
  enabled: false           # requires the Prometheus Operator CRDs
  interval: 30s
  labels: {}

# --- Probes -------------------------------------------------------------------
# /livez: process up. /readyz: start-up (incl. migrations) done; NOT tied to
# upstream nodes, so a TronGrid/toncenter/RPC outage keeps the pod in its
# Service and /metrics + /v1 stay reachable. /healthz returns 503 when no block
# was processed for http.health_stale_after (2m) on any chain or the DB is
# unreachable; liveness uses it leniently (10 × 30s) so a remote outage does
# not cause a restart storm – alert on it instead (see README "Monitoring").
# startupProbe gives long migrations (e.g. index builds on a big table) up to
# 10 minutes before liveness starts counting.
startupProbe:
  httpGet: {path: /livez, port: http}
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 60
livenessProbe:
  httpGet: {path: /healthz, port: http}
  initialDelaySeconds: 0
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 10
readinessProbe:
  httpGet: {path: /readyz, port: http}
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# --- Resources & security -----------------------------------------------------
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# /data holds the file cursor when no database is configured. emptyDir loses
# it on pod restart (the listener then restarts at the safe head); enable a
# PVC or, better, use Postgres (cursor stored in the DB).
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

terminationGracePeriodSeconds: 40   # finish the in-flight block on SIGTERM

# Optional PodDisruptionBudget. The listener is a single writer, so
# maxUnavailable: 0 would block `kubectl drain`; keep 1 unless you really
# want to pin the pod (missed blocks are caught up from the cursor anyway).
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
