apiVersion: v2
name: usdt-tracker
description: >-
  Read-only USDT transfer listener for TRON (TRC-20), TON (USD₮ jetton) and Ethereum (ERC-20) with a runtime watch-list API
  (/v1/addresses), Prometheus metrics and optional bundled PostgreSQL.
type: application
version: 0.5.0
appVersion: "latest"
home: https://github.com/co-codin/USDT-Tracker
sources:
  - https://github.com/co-codin/USDT-Tracker
keywords: [tron, ton, ethereum, usdt, trc20, erc20, jetton, blockchain, listener, payments]
maintainers:
  - name: co-codin
    url: https://github.com/co-codin
dependencies:
  # Optional bundled database for demos/small installs. Free Bitnami images are
  # "latest"-only and intended for non-production use: in production set
  # postgresql.enabled=false and use externalDatabase (managed Postgres).
  - name: postgresql
    version: 18.12.4
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
