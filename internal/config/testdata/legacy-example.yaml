# USDT-Tracker configuration.
# Copy to config.yaml and adjust. Every value can be overridden by an
# environment variable (see README "Configuration"); keep secrets in env.

log:
  level: info          # debug | info | warn | error
  format: json         # json | text   (application logs go to stderr)

# Chains to listen on: any of tron (default), ton, eth — e.g. [tron, ton, eth] (all run
# concurrently with their own cursor; sinks, filter rules and the admin API are shared).
chains: [tron]           # env CHAINS=tron,ton,eth

tron:
  api_url: https://api.trongrid.io   # any TRON full node HTTP API (TronGrid compatible)
  api_key: ""                        # env TRON_PRO_API_KEY (optional, raises rate limits)
  timeout: 15s
  rps: 3                             # client-side request rate limit; keep low without an API key
  max_retries: 8                     # per request, exponential backoff, honours 429 Retry-After
  verify_tx_count: true   # env TRON_VERIFY_TX_COUNT; cross-check tx-info count per block (+1 request/block)

token:
  contract: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t   # USDT (TRC-20) on TRON mainnet
  symbol: USDT
  decimals: 6

listener:
  confirmations: 20      # stay N blocks behind head (~60s); 19+ ≈ solidified/irreversible
  poll_interval: 3s      # TRON produces a block every ~3s
  start_block: 0         # used only when no cursor exists: 0 = safe head, N = exact block, -N = N blocks back
  batch_size: 20         # max blocks per iteration
  concurrency: 2         # parallel block fetches (blocks are still delivered in order)
  dedupe_cache_size: 100000
  dispatch_timeout: 30s  # per delivery attempt; an in-flight block is finished on shutdown

cursor:
  file: ./data/cursor.json   # TRON cursor; ignored when the postgres sink is enabled (cursor stored in DB)

# TON (used when chains contains ton). Read-only, via the public toncenter v3
# index API. Block numbers on TON are masterchain seqnos (~2.4 blocks/s).
ton:
  api_url: https://toncenter.com/api/v3
  api_key: ""                # env TONCENTER_API_KEY. Without a key toncenter allows ~1 req/s, too slow
                             # for mainnet head (2 requests per masterchain block). Free key: @tonapibot
  timeout: 15s
  rps: 1                     # raise to ~9 with a free key (10 rps plan)
  max_retries: 8
  jetton_master: EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs   # official USD₮ on TON
  symbol: USDT
  decimals: 6
  # TON addresses to watch (raw 0:<hex> or user-friendly EQ…/UQ…); filter.direction,
  # filter.min_amount and filter.mode apply. Runtime TON addresses come from /v1/addresses.
  watch_addresses: []
  confirmations: 3           # masterchain blocks are final once indexed; small margin for indexer lag
  poll_interval: 1s
  start_block: 0             # same semantics as listener.start_block, in masterchain seqnos
  batch_size: 20
  concurrency: 2
  cursor_file: ./data/cursor-ton.json   # with postgres the cursor is "<cursor_name>:ton" in listener_cursor

# Ethereum (used when chains contains eth). Read-only ERC-20 USDT via standard
# JSON-RPC (eth_blockNumber + eth_getLogs over block ranges). ~12 s blocks.
eth:
  rpc_url: https://ethereum-rpc.publicnode.com   # env ETH_RPC_URL. Provider URLs (Infura/Alchemy/…) embed
                             # an API key: set it via env, it is never logged (only scheme://host).
  timeout: 20s
  rps: 5
  max_retries: 8
  contract: "0xdAC17F958D2ee523a2206206994597C13D831ec7"   # Tether USD (USDT), 6 decimals
  symbol: USDT
  decimals: 6
  # Ethereum addresses to watch (0x…, lowercase or EIP-55 checksummed); filter.* rules apply.
  watch_addresses: []
  confirmations: 12          # reorg safety margin (blocks)
  poll_interval: 6s
  start_block: 0             # same semantics as listener.start_block
  batch_size: 50             # blocks processed per iteration
  log_chunk: 50              # max blocks per eth_getLogs call; halved automatically if the node refuses
  head_tag: latest      # latest (minus confirmations) | safe | finalized
  cursor_file: ./data/cursor-eth.json   # with postgres the cursor is "<cursor_name>:eth"

filter:
  # Leave watch_addresses empty and min_amount "0" to emit every transfer (firehose).
  # These are TRON addresses; TON addresses go to ton.watch_addresses.
  watch_addresses: []
  #  - TXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
  direction: both        # both | incoming | outgoing (relative to watched addresses)
  min_amount: "0"        # large-transfer threshold in USDT, e.g. "100000"
  mode: any              # any = watched OR large, all = watched AND large
  # Runtime watch list: with the postgres sink enabled, enabled rows of the
  # watch_addresses table (managed via the /v1/addresses API) are merged with
  # watch_addresses above. API writes apply immediately; other DB changes
  # within reload_interval.
  reload_interval: 5s

http:
  addr: "127.0.0.1:9090"     # /metrics, /healthz and the admin API (/v1/*); empty disables. Default is localhost only;
                             # use ":9090" to listen on all interfaces – then put the admin API behind a TLS reverse proxy
  health_stale_after: 2m     # /healthz returns 503 if no progress for this long

api:
  # Bearer token for the admin API (GET/POST/DELETE /v1/addresses).
  # Also protects GET /v1/export.csv (per-address CSV statement).
  # Empty = API disabled. Prefer env API_TOKEN; generate with `openssl rand -hex 32` (min 16 chars).
  # Needs the postgres sink, otherwise the API answers 503.
  token: ""

sinks:
  stdout:
    enabled: true            # one JSON line per transfer on stdout

  webhook:
    enabled: false
    url: ""                  # env WEBHOOK_URL
    secret: ""               # env WEBHOOK_SECRET (HMAC-SHA256 signing key)
    timeout: 10s
    max_retries: 5
    best_effort: false       # false = block is retried until the webhook accepts it
    headers: {}

  telegram:
    enabled: false
    bot_token: ""            # env TELEGRAM_BOT_TOKEN
    chat_id: ""              # env TELEGRAM_CHAT_ID
    min_amount: ""           # optional extra threshold for alerts (watched-address hits always alert)
    max_messages_per_block: 10
    best_effort: true        # alerts never stall the pipeline
    api_base: ""             # default https://api.telegram.org (override for a proxy)

  postgres:
    enabled: false
    dsn: ""                  # env DATABASE_URL, e.g. postgres://user:pass@localhost:5432/tron?sslmode=disable
    cursor_name: default
    best_effort: false

# Large-transfer channel: posts every transfer >= threshold on ANY enabled chain
# (independent of the watch list and filter) to a Telegram channel, with
# tronscan / tonviewer / etherscan links. Add the bot to the channel as an admin.
# Paced to respect Telegram limits (~20 messages/minute per channel); bursts are
# batched into one message (up to max_per_message transfers). Best-effort: never
# blocks the listeners; a full queue drops the oldest pending alerts.
alerts:
  large_transfers:
    enabled: false           # env LARGE_ALERTS_ENABLED
    bot_token: ""            # env LARGE_ALERTS_BOT_TOKEN (default: sinks.telegram.bot_token / TELEGRAM_BOT_TOKEN)
    chat_id: ""              # env LARGE_ALERTS_CHAT_ID, e.g. @usdt_whales or -100123…
    threshold: "100000"      # env LARGE_ALERTS_THRESHOLD (token units)
    interval: 3s             # env LARGE_ALERTS_INTERVAL, min gap between messages (>= 500ms)
    max_per_message: 10      # 1..30
    queue_size: 1000
    footer: ""               # env LARGE_ALERTS_FOOTER, optional HTML line, e.g. 'via <a href="https://github.com/co-codin/USDT-Tracker">USDT-Tracker</a>'
    api_base: ""             # default https://api.telegram.org

# Self-service Telegram notify bot: users send /add <address> (TRON T…, TON UQ…/EQ…,
# Ethereum 0x… — detected automatically) and get a private message for every incoming
# and outgoing USDT transfer. Independent of the watch list. Runs inside the listener
# (long polling, no webhook/public URL needed) and needs the postgres sink.
# Commands: /start /help /add /list /remove /plan.
notify_bot:
  enabled: false             # env NOTIFY_BOT_ENABLED
  bot_token: ""              # env TELEGRAM_NOTIFY_BOT_TOKEN (create a separate bot with @BotFather)
  free_limit: 3              # env NOTIFY_FREE_LIMIT, addresses per user on plan 'free'
  premium_limit: 50          # env NOTIFY_PREMIUM_LIMIT, plan 'premium' (set notify_users.plan; no billing built in)
  max_users: 10000          # env NOTIFY_MAX_USERS, bot-wide cap on users (0 = unlimited)
  max_total_subs: 50000     # env NOTIFY_MAX_TOTAL_SUBS, bot-wide cap on subscriptions
  commands_per_minute: 20   # env NOTIFY_COMMANDS_PER_MINUTE, per chat (burst 5); extra messages are dropped
  premium_contact: ""       # env NOTIFY_PREMIUM_CONTACT, shown by /plan (e.g. "@you" or a URL)
  min_amount: "0.01"         # env NOTIFY_MIN_AMOUNT, skips dust / zero-value address-poisoning transfers
  poll_timeout: 50s
  api_base: ""
